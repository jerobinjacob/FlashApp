<!DOCTYPE html>
<html>
    <head>
        <title> Add Student </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
      <div class="form-box">
        <h1> Add New Student </h1>
          {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul style='color: red;'>
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
        <form method="POST">
        <label>Name:</label>
        <input type="text" name="name" value="{{ name }}">

        <label>Age:</label>
        <input type="text" name="age" value="{{ age }}">

        <label>Course:</label>
        <input type="text" name="course" value="{{ course }}">

        <label>Professor ID:</label>
        <input type="text" name="professor_id" value="{{ professor_id }}">

        <label>Favourite Professor ID:</label>
        <input type="text" name="favourite_professors" value="{{ favourite_professors }}">

        <input type="submit" value="Add Student">
        </form>
      </div>
    </body>
</html>
